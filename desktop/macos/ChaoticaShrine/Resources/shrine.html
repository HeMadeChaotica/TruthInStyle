<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHAOTICA Shrine</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { color: #ffe8f0; font-family: "Avenir Next", "Helvetica Neue", sans-serif; user-select: none; }
    .shrine { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 22px; background: #12030d url("ShrineOpen.png") center / cover no-repeat; box-shadow: 0 20px 46px rgba(0, 0, 0, .56), 0 0 28px rgba(231, 48, 126, .24); }
    .shrine::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 15% 43%, rgba(255, 142, 192, .16), transparent 36%), linear-gradient(90deg, transparent 50%, rgba(4, 0, 4, .08)); mix-blend-mode: screen; }
    .drag-rim { position: absolute; inset: 0 0 auto; height: 18px; z-index: 8; -webkit-app-region: drag; }
    /* The artwork's old five-box suggestion is intentionally covered by one readable deck. */
    .truth-deck { position: absolute; z-index: 3; left: 42.3%; right: 2.7%; top: 7.5%; bottom: 7.5%; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 31px 23px; border-radius: 20px; background: linear-gradient(135deg, rgba(25, 0, 17, .985), rgba(48, 1, 28, .975)); box-shadow: inset 0 0 0 1px rgba(255, 155, 204, .52), 0 14px 34px rgba(0, 0, 0, .30); }
    .signal { min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0; border: 0; border-radius: 0; background: transparent; color: inherit; text-align: left; cursor: pointer; transition: opacity .22s ease, transform .18s ease; }
    .signal:hover { opacity: .92; transform: translateY(-1px); }
    .title-signal { min-height: 42%; }
    .label { color: #ffb6d3; font-size: 20px; font-weight: 850; letter-spacing: .15em; line-height: 1; text-shadow: 0 1px 6px rgba(23, 0, 15, .9); text-transform: uppercase; }
    .title-value { display: block; max-width: 100%; margin-top: 12px; overflow: hidden; color: #fff8fa; font-family: Georgia, "Times New Roman", serif; font-size: clamp(42px, 5vw, 53px); font-weight: 700; letter-spacing: .01em; line-height: 1.04; text-overflow: ellipsis; text-shadow: 0 2px 10px rgba(20, 0, 12, .96); white-space: nowrap; }
    .meta-line { min-height: 18%; padding: 16px 0; border-top: 1px solid rgba(255, 174, 211, .42); border-bottom: 1px solid rgba(255, 174, 211, .42); }
    .meta-value { display: block; margin-top: 9px; overflow: hidden; color: #ffdce9; font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 3.45vw, 34px); font-weight: 700; letter-spacing: .01em; line-height: 1.1; text-overflow: ellipsis; white-space: nowrap; }
    .pulse { min-height: 29%; padding-top: 15px; }
    .pulse .label { color: #ffd2e4; }
    .pulse-value { display: block; max-width: 100%; margin-top: 10px; overflow: hidden; color: #ffffff; font-family: Georgia, "Times New Roman", serif; font-size: clamp(32px, 4vw, 40px); font-weight: 700; letter-spacing: .01em; line-height: 1.1; text-overflow: ellipsis; white-space: nowrap; }
    .rotation-dots { display: flex; gap: 7px; margin-top: 11px; }
    .rotation-dot { width: 10px; height: 10px; border: 1px solid rgba(255, 189, 218, .74); border-radius: 50%; background: transparent; transition: transform .26s ease, background .26s ease; }
    .rotation-dot.active { transform: scale(1.35); background: #ff86bc; box-shadow: 0 0 10px #ff86bc; }
    .empty { color: rgba(255, 221, 234, .68); font-family: "Avenir Next", sans-serif; font-size: 25px; font-weight: 600; letter-spacing: .05em; }
    .is-switching { opacity: .16; }
  </style>
</head>
<body>
  <main class="shrine" aria-label="CHAOTICA Desk Shrine">
    <div class="drag-rim"></div>
    <section class="truth-deck" aria-label="Live day signals">
      <button class="signal title-signal" data-route="the-assurer"><span class="label">Title of the Day</span><strong class="title-value" id="title">—</strong></button>
      <button class="signal meta-line" data-route="the-assurer"><span class="label">Mood · Era</span><strong class="meta-value" id="mood-era">—</strong></button>
      <button class="signal pulse" id="pulse" data-route="the-assurer"><span class="label" id="pulse-label">Macro Progress</span><strong class="pulse-value" id="pulse-value">—</strong><span class="rotation-dots" aria-label="Rotating day signal"><i class="rotation-dot active"></i><i class="rotation-dot"></i></span></button>
    </section>
  </main>
  <script>
    let pulseItems = [];
    let pulseIndex = 0;
    let rotationTimer = null;
    function clean(value) { return typeof value === "string" && value.trim() ? value.trim() : "—"; }
    function setText(id, value) {
      const node = document.getElementById(id);
      if (!node) return;
      node.textContent = value;
      node.classList.toggle("empty", value === "—");
    }
    function drawPulse() {
      const box = document.getElementById("pulse");
      const item = pulseItems[pulseIndex] || { label: "Day Pulse", value: "—", route: "the-assurer" };
      box.classList.add("is-switching");
      window.setTimeout(() => {
        document.getElementById("pulse-label").textContent = item.label;
        setText("pulse-value", item.value);
        box.dataset.route = item.route;
        document.querySelectorAll(".rotation-dot").forEach((dot, index) => dot.classList.toggle("active", index === pulseIndex));
        box.classList.remove("is-switching");
      }, 145);
    }
    function startRotation() {
      if (rotationTimer) window.clearInterval(rotationTimer);
      if (pulseItems.length < 2) return;
      rotationTimer = window.setInterval(() => {
        pulseIndex = (pulseIndex + 1) % pulseItems.length;
        drawPulse();
      }, 4000);
    }
    window.ChaoticaShrine = Object.freeze({
      setSnapshot(snapshot = {}) {
        setText("title", clean(snapshot.title));
        const mood = clean(snapshot.mood);
        const era = clean(snapshot.era);
        setText("mood-era", mood !== "—" && era !== "—" ? `${mood} · ${era}` : (mood !== "—" ? mood : era));
        // The lower reading surface visibly alternates between these two real data types.
        // Empty values remain dashes; no invented content is ever shown.
        pulseItems = [
          { label: "Macro Progress", value: clean(snapshot.macro), route: "da-eater" },
          { label: "Next Commitment", value: clean(snapshot.next), route: "thicc-fitt" }
        ];
        pulseIndex = 0;
        drawPulse();
        startRotation();
      }
    });
    document.querySelectorAll("[data-route]").forEach((node) => node.addEventListener("click", () => {
      window.webkit?.messageHandlers?.chaoticaShrine?.postMessage({ action: "open", route: node.dataset.route });
    }));
  </script>
</body>
</html>
