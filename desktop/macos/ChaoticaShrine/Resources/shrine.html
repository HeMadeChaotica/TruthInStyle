<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHAOTICA Shrine</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font-family: "Avenir Next", "Helvetica Neue", sans-serif; color: #fff0e9; user-select: none; }
    .shrine { position: relative; width: 100%; height: 100%; overflow: hidden; border: 1px solid rgba(248, 169, 168, .52); border-radius: 32px; background: radial-gradient(circle at 50% 8%, rgba(255, 181, 200, .3), transparent 32%), linear-gradient(145deg, rgba(38, 10, 19, .96), rgba(12, 5, 9, .94)); box-shadow: inset 0 0 50px rgba(255, 123, 165, .18), 0 22px 60px rgba(0, 0, 0, .52); }
    .shrine::before { content: ""; position: absolute; inset: 0; opacity: .65; background: repeating-linear-gradient(115deg, transparent 0 34px, rgba(255, 165, 191, .04) 35px 36px); pointer-events: none; }
    .drag-rim { height: 28px; position: absolute; inset: 0 0 auto; z-index: 3; }
    .content { position: relative; z-index: 2; height: 100%; padding: 25px 26px 22px; display: flex; flex-direction: column; align-items: center; }
    .eyebrow { margin-top: 5px; letter-spacing: .18em; font-size: 10px; color: #f7b7c8; font-weight: 800; }
    .seal-wrap { position: relative; width: min(68vw, 230px); aspect-ratio: 1; margin: 12px 0 8px; }
    .seal-wrap::before { content: ""; position: absolute; inset: 9%; border-radius: 50%; background: #f68da8; filter: blur(28px); opacity: .25; animation: breathe 3.8s ease-in-out infinite; }
    .seal { position: relative; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 14px 20px rgba(0, 0, 0, .56)); animation: seal-breathe 5.4s ease-in-out infinite; }
    .day { margin-top: 1px; font-family: Georgia, serif; color: #ffe0b0; font-size: 22px; font-weight: 700; letter-spacing: .04em; }
    .time { margin-top: 4px; color: #eeb1bd; font-size: 12px; letter-spacing: .12em; }
    .pulse { display: grid; grid-template-columns: 1fr 1fr; width: 100%; margin: 17px 0 12px; border: 1px solid rgba(255, 201, 173, .18); border-radius: 17px; background: rgba(255, 198, 196, .06); overflow: hidden; }
    .pulse div { padding: 10px 11px; }
    .pulse div + div { border-left: 1px solid rgba(255, 201, 173, .18); }
    .label { display: block; color: #e5a2b8; font-size: 8px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .value { display: block; margin-top: 3px; color: #fff0e9; font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .portal { width: 100%; border: 1px solid rgba(255, 222, 190, .57); border-radius: 999px; padding: 11px 14px; background: linear-gradient(105deg, #a52e58, #e95e92 52%, #bb734d); color: #fff8f0; cursor: pointer; font: 800 11px/1 "Avenir Next", sans-serif; letter-spacing: .14em; transition: transform .18s ease, filter .18s ease; }
    .portal:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .portal:active { transform: translateY(1px); }
    .links { display: flex; justify-content: center; gap: 13px; margin-top: 13px; }
    .links button { appearance: none; border: 0; background: transparent; color: #efb1be; font: 800 9px/1 "Avenir Next", sans-serif; letter-spacing: .12em; cursor: pointer; padding: 4px; }
    .links button:hover { color: #ffe2ad; }
    .status { position: absolute; bottom: 10px; color: rgba(255, 224, 205, .5); font-size: 8px; letter-spacing: .14em; }
    @keyframes breathe { 50% { transform: scale(1.14); opacity: .42; } }
    @keyframes seal-breathe { 50% { transform: scale(1.025); filter: drop-shadow(0 16px 27px rgba(240, 92, 138, .38)); } }
  </style>
</head>
<body>
  <main class="shrine">
    <div class="drag-rim"></div>
    <section class="content">
      <div class="eyebrow">CHAOTICA · DESK SHRINE</div>
      <div class="seal-wrap"><img class="seal" src="chaotica-seal.png" alt="CHAOTICA seal" /></div>
      <div class="day" id="day">TODAY</div>
      <div class="time" id="time">—</div>
      <div class="pulse">
        <div><span class="label">Day Pulse</span><span class="value">Speak it true.</span></div>
        <div><span class="label">Portal</span><span class="value">The Assurer</span></div>
      </div>
      <button class="portal" onclick="openPortal('the-assurer')">ENTER CHAOTICA</button>
      <nav class="links" aria-label="Quick entrances">
        <button onclick="openPortal('the-summation')">SUMMATION</button>
        <button onclick="openPortal('hopewood')">HOPEWOOD</button>
        <button onclick="openPortal('525600')">525600</button>
      </nav>
      <div class="status">ALWAYS WITHIN REACH</div>
    </section>
  </main>
  <script>
    const dateFormat = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const timeFormat = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
    function updateClock() { const now = new Date(); document.getElementById('day').textContent = dateFormat.format(now).toUpperCase(); document.getElementById('time').textContent = timeFormat.format(now).toUpperCase(); }
    function openPortal(route) { window.webkit?.messageHandlers?.chaoticaShrine?.postMessage({ action: 'open', route }); }
    updateClock(); setInterval(updateClock, 1000);
  </script>
</body>
</html>
