<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHAOTICA Shrine</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { color: #fff0f4; font-family: "Avenir Next", "Helvetica Neue", sans-serif; user-select: none; }
    .shrine { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 28px; background: #18030e url("ShrineOpen.png") center / cover no-repeat; box-shadow: 0 24px 62px rgba(0, 0, 0, .64), 0 0 42px rgba(255, 79, 161, .28); }
    .shrine::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, transparent 38%, rgba(12, 0, 8, .08) 47%, rgba(10, 0, 7, .42) 58%, rgba(10, 0, 7, .78) 100%); }
    .shrine::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 26% 49%, rgba(255, 141, 197, .13), transparent 31%), linear-gradient(0deg, rgba(0, 0, 0, .13), transparent 27%); mix-blend-mode: screen; }
    .drag-rim { position: absolute; inset: 0 0 auto; height: 22px; z-index: 8; -webkit-app-region: drag; }
    .reading-field { position: absolute; z-index: 3; top: 7%; right: 4.5%; bottom: 7%; width: 47%; display: grid; grid-template-rows: auto 1fr; gap: 22px; padding: 6px 0 0 32px; border-left: 1px solid rgba(255, 183, 218, .42); }
    button { font: inherit; }
    .identity, .carousel { min-width: 0; text-align: left; color: inherit; background: transparent; border: 0; cursor: pointer; }
    .identity { padding: 0 0 21px; border-bottom: 1px solid rgba(255, 183, 218, .42); transition: opacity .2s ease; }
    .identity:hover, .carousel:hover { opacity: .9; }
    .eyebrow { display: block; color: #ffc1dc; font-size: 20px; font-weight: 900; letter-spacing: .18em; line-height: 1; text-transform: uppercase; text-shadow: 0 2px 8px rgba(25, 0, 17, .95); }
    .title { display: block; max-width: 100%; margin-top: 13px; overflow: hidden; color: #fff9fb; font-family: Georgia, "Times New Roman", serif; font-size: 48px; font-weight: 700; letter-spacing: .01em; line-height: 1.04; text-overflow: ellipsis; text-shadow: 0 3px 14px rgba(20, 0, 12, 1); white-space: nowrap; }
    .identity-meta { display: block; margin-top: 14px; color: #ffe1ed; font-family: Georgia, "Times New Roman", serif; font-size: 23px; font-weight: 700; letter-spacing: .02em; line-height: 1.2; text-shadow: 0 2px 10px rgba(20, 0, 12, 1); }
    .identity-meta span + span::before { content: " • "; color: #ff76b3; }
    .carousel { position: relative; display: flex; min-height: 0; flex-direction: column; justify-content: space-between; padding: 12px 0 0; transition: opacity .16s ease, transform .16s ease; }
    .carousel.is-switching { opacity: .13; transform: translateY(5px); }
    .signal-label { display: block; color: #ffb7d8; font-size: 23px; font-weight: 900; letter-spacing: .16em; line-height: 1.1; text-transform: uppercase; text-shadow: 0 2px 9px rgba(25, 0, 17, .95); }
    .signal-value { display: block; max-width: 100%; margin-top: 20px; overflow: hidden; color: #ffffff; font-family: Georgia, "Times New Roman", serif; font-size: 35px; font-weight: 700; letter-spacing: .005em; line-height: 1.16; text-shadow: 0 3px 13px rgba(20, 0, 12, 1); }
    .signal-value.empty { color: rgba(255, 218, 232, .65); font-family: "Avenir Next", sans-serif; font-size: 30px; }
    .macro-bars { display: none; gap: 15px; margin: 27px 0 auto; padding-right: 8px; }
    .macro-bars.is-active { display: grid; }
    .macro-row { display: grid; grid-template-columns: 105px 1fr auto; align-items: center; gap: 13px; color: #ffedf5; font-size: 20px; font-weight: 800; letter-spacing: .04em; }
    .macro-track { height: 15px; overflow: hidden; border: 1px solid rgba(255, 194, 222, .55); border-radius: 999px; background: rgba(7, 0, 5, .58); box-shadow: inset 0 1px 5px rgba(0, 0, 0, .7); }
    .macro-fill { height: 100%; min-width: 2px; border-radius: inherit; background: linear-gradient(90deg, #df3d89, #ff9fc9 72%, #ffe5ef); box-shadow: 0 0 13px rgba(255, 93, 169, .75); }
    .macro-copy { color: #fff4f8; font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 700; white-space: nowrap; }
    .rotation { display: flex; align-items: center; gap: 8px; margin-top: 24px; }
    .rotation i { width: 10px; height: 10px; border: 1px solid rgba(255, 191, 221, .85); border-radius: 50%; background: transparent; transition: transform .24s ease, background .24s ease; }
    .rotation i.active { transform: scale(1.4); background: #ff71b3; box-shadow: 0 0 12px #ff71b3; }
  </style>
</head>
<body>
  <main class="shrine" aria-label="CHAOTICA Assurer Shrine">
    <div class="drag-rim"></div>
    <section class="reading-field" aria-label="Live day signals">
      <button class="identity" data-route="the-assurer">
        <span class="eyebrow">Title of the Day</span>
        <strong class="title" id="title">—</strong>
        <span class="identity-meta"><span id="date">—</span><span id="chaotica-day">CHAOTICA DAY #—</span></span>
      </button>
      <button class="carousel" id="carousel" data-route="the-assurer">
        <span>
          <span class="signal-label" id="signal-label">Day Pulse</span>
          <strong class="signal-value" id="signal-value">—</strong>
          <span class="macro-bars" id="macro-bars" aria-label="Macro progress bars"></span>
        </span>
        <span class="rotation" id="rotation" aria-label="Rotating day signals"></span>
      </button>
    </section>
  </main>
  <script>
    let signals = [], macroBars = [], signalIndex = 0, rotationTimer = null;
    const clean = (value) => typeof value === "string" && value.trim() ? value.trim() : "—";
    const clip = (value, limit = 240) => value.length > limit ? `${value.slice(0, limit - 1).trimEnd()}…` : value;
    function setText(id, value) { const node = document.getElementById(id); const safe = clean(value); node.textContent = safe; node.classList.toggle("empty", safe === "—"); }
    function drawMacros() {
      const box = document.getElementById("macro-bars"); box.innerHTML = "";
      macroBars.forEach((bar) => {
        const current = Number(bar?.current || 0), target = Math.max(Number(bar?.target || 0), 1), percent = Math.max(0, Math.min(100, Math.round((current / target) * 100)));
        const row = document.createElement("div"); row.className = "macro-row";
        row.innerHTML = `<span>${clean(bar?.label)}</span><span class="macro-track"><span class="macro-fill" style="width:${percent}%"></span></span><span class="macro-copy">${Math.round(current)}/${Math.round(target)} ${clean(bar?.unit)}</span>`;
        box.appendChild(row);
      });
    }
    function drawSignal() {
      const carousel = document.getElementById("carousel"), item = signals[signalIndex] || { label: "Day Pulse", value: "—", route: "the-assurer", kind: "text" };
      carousel.classList.add("is-switching");
      window.setTimeout(() => {
        document.getElementById("signal-label").textContent = item.label || "Day Pulse";
        setText("signal-value", clip(clean(item.value)));
        document.getElementById("macro-bars").classList.toggle("is-active", item.kind === "macro" && macroBars.length > 0);
        carousel.dataset.route = item.route || "the-assurer";
        document.querySelectorAll("#rotation i").forEach((dot, index) => dot.classList.toggle("active", index === signalIndex));
        carousel.classList.remove("is-switching");
      }, 155);
    }
    function beginRotation() { if (rotationTimer) window.clearInterval(rotationTimer); if (signals.length < 2) return; rotationTimer = window.setInterval(() => { signalIndex = (signalIndex + 1) % signals.length; drawSignal(); }, 6000); }
    function drawDots() { const box = document.getElementById("rotation"); box.innerHTML = ""; signals.forEach((_, index) => { const dot = document.createElement("i"); dot.classList.toggle("active", index === signalIndex); box.appendChild(dot); }); }
    window.ChaoticaShrine = Object.freeze({
      setSnapshot(snapshot = {}) {
        setText("title", snapshot.title); setText("date", snapshot.displayDate || snapshot.dayOfWeek);
        setText("chaotica-day", Number.isFinite(Number(snapshot.chaoticaDayNumber)) ? `CHAOTICA DAY #${Number(snapshot.chaoticaDayNumber)}` : "CHAOTICA DAY #—");
        macroBars = Array.isArray(snapshot.macroBars) ? snapshot.macroBars : []; drawMacros();
        signals = Array.isArray(snapshot.signals) && snapshot.signals.length ? snapshot.signals : [{ label: "Day Pulse", value: "—", route: "the-assurer", kind: "text" }];
        signalIndex = 0; drawDots(); drawSignal(); beginRotation();
      }
    });
    document.querySelectorAll("[data-route]").forEach((node) => node.addEventListener("click", () => window.webkit?.messageHandlers?.chaoticaShrine?.postMessage({ action: "open", route: node.dataset.route })));
  </script>
</body>
</html>
